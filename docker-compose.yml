services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}/media:/media
    ports:
      - "8096:8096"   # Web UI / HTTP streaming
      - "8920:8920"   # HTTPS streaming (optional, not configured yet)
      - "7359:7359/udp"  # Network discovery
      - "1900:1900/udp"  # DLNA discovery
    restart: unless-stopped

  # Currently NOT routed through a VPN — see the commented "VPN (optional)"
  # block at the bottom of this file for how to add Gluetun later.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}/torrents:/downloads
    restart: unless-stopped

  # Not routed through the VPN on purpose: it only makes normal HTTPS
  # requests to indexer sites, it never joins a torrent swarm.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  # Helper browser Prowlarr calls when an indexer is behind Cloudflare.
  # No volumes needed — it holds no persistent state of its own.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "8191:8191"
    restart: unless-stopped

  # Same /media and /downloads paths as qbittorrent and jellyfin use — this is
  # what lets Sonarr hardlink a finished download straight into the library
  # instead of copying it (same files, no wasted disk space).
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}/media:/media
      - ${MEDIA_ROOT}/torrents:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}/media:/media
      - ${MEDIA_ROOT}/torrents:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped

  # Request UI (Overseerr/Jellyseerr's successor project). Rootless image —
  # no PUID/PGID support, unlike the linuxserver.io images above.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  # Downloads subtitles for anything Sonarr/Radarr import. Needs /media
  # (same path as everything else) to find the video files.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}/media:/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  # No web UI. Reads /config/recyclarr.yml and syncs TRaSH Guide quality
  # profiles into Sonarr/Radarr once a day (CRON_SCHEDULE default: @daily).
  # recyclarr.yml doesn't exist yet on the first run — see README for the
  # one-time setup command.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    environment:
      - TZ=${TZ}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/recyclarr:/config
    restart: unless-stopped

  # Remote access for outside the home network. Joins the tailnet as its own
  # machine named "jellyfin" and serves ONLY Jellyfin (HTTPS on 443, see
  # tailscale/serve.json). This machine is what gets shared with friends, so
  # nothing else in the stack is reachable to them. Your own full remote access
  # comes from the Tailscale Windows app on the host, not from this container.
  #
  # No container "hostname:" on purpose: it would make the name "jellyfin"
  # resolve to this container itself, and the proxy would loop back into it.
  # The tailnet name comes from TS_HOSTNAME instead.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_AUTH_ONCE=true            # use the key only on first login; state keeps it logged in after
      - TS_HOSTNAME=jellyfin         # name in the tailnet -> https://jellyfin.<tailnet>.ts.net
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true            # no /dev/net/tun needed; works on Docker Desktop
    volumes:
      - ${CONFIG_ROOT}/tailscale:/var/lib/tailscale   # node identity (secret, not in git)
      - ./tailscale:/config:ro                        # serve.json (in git); mounted as a dir so edits are picked up
    depends_on:
      - jellyfin
    restart: unless-stopped

  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # מאפשר ל-Homarr לקרוא סטטוס של קונטיינרים
      - ${CONFIG_ROOT}/homarr/configs:/app/data/configs
      - ${CONFIG_ROOT}/homarr/icons:/app/public/icons
      - ${CONFIG_ROOT}/homarr/data:/data
    ports:
      - "7575:7575"
    restart: unless-stopped

  # חיבור Tailscale נפרד לדשבורד, יופיע ברשת כ-"dashboard"
  tailscale-homarr:
    image: tailscale/tailscale:latest
    container_name: tailscale-homarr
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}     # ודא שהמפתח ב-.env מוגדר כ-Reusable כדי לשמש מספר מכונות
      - TS_AUTH_ONCE=true
      - TS_HOSTNAME=dashboard        # ה-URL בו תשתמש: https://dashboard.<tailnet>.ts.net
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ${CONFIG_ROOT}/tailscale-homarr:/var/lib/tailscale   # שמירת זהות המכונה החדשה
      - ./tailscale-homarr:/config:ro                        # תיקייה חדשה לקובץ הניתוב של הדשבורד
    depends_on:
      - homarr
    restart: unless-stopped

