services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/appdata/jellyfin:/config
      - ${DATA_ROOT}/media:/media
    ports:
      - "8096:8096"   # Web UI / HTTP streaming
      - "8920:8920"   # HTTPS streaming (optional, not configured yet)
      - "7359:7359/udp"  # Network discovery
      - "1900:1900/udp"  # DLNA discovery
    restart: unless-stopped

  # Currently NOT routed through a VPN — see the commented "VPN (optional)"
  # block at the bottom of this file for how to add Gluetun later.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ${DATA_ROOT}/appdata/qbittorrent:/config
      - ${DATA_ROOT}/torrents:/downloads
    restart: unless-stopped

  # Not routed through the VPN on purpose: it only makes normal HTTPS
  # requests to indexer sites, it never joins a torrent swarm.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/appdata/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  # Helper browser Prowlarr calls when an indexer is behind Cloudflare.
  # No volumes needed — it holds no persistent state of its own.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "8191:8191"
    restart: unless-stopped

  # Same /media and /downloads paths as qbittorrent and jellyfin use — this is
  # what lets Sonarr hardlink a finished download straight into the library
  # instead of copying it (same files, no wasted disk space).
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/appdata/sonarr:/config
      - ${DATA_ROOT}/media:/media
      - ${DATA_ROOT}/torrents:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/appdata/radarr:/config
      - ${DATA_ROOT}/media:/media
      - ${DATA_ROOT}/torrents:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped

# ============================================================
